version: '3.8'

services:
  remote-agent:
    build: .
    container_name: remote-agent-env
    ports:
      - "8000:8000"  # FastAPI/Flask
      - "8888:8888"  # Jupyter
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app/src
      - AUGMENT_ENV=docker
    stdin_open: true
    tty: true
    command: bash

  jupyter:
    build: .
    container_name: jupyter-server
    ports:
      - "8889:8888"
    volumes:
      - .:/app
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONPATH=/app/src
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root

volumes:
  data:
  models:
